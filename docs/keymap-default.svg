<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="856" viewBox="0 0 1530 856" role="img" aria-labelledby="title desc">
<title id="title">Cornix LP — KobitoKey / 40 keys + 2 knobs</title>
<desc id="desc">Cornixのキー座標と回転を使用。左右全4段の最外列は無効。内側5列に40キーを割り当て、ノブは標準の音量・スクロール・押し込み動作。</desc>
<g font-family="&#x27;Noto Sans CJK JP&#x27;,&#x27;Hiragino Kaku Gothic ProN&#x27;,&#x27;Yu Gothic&#x27;,sans-serif">
<rect x="0" y="0" width="1530" height="856" rx="0" fill="#f5f8fc" stroke="none"/>
<text x="32" y="45" font-size="29" fill="#18304b" font-weight="700" text-anchor="start">Cornix LP — KobitoKey / 40 keys + 2 knobs</text>
<text x="32" y="78" font-size="17" fill="#52667e" font-weight="400" text-anchor="start">上段：タップ / 動作　　青い下段：長押し　　▽：下位の有効なレイヤーを使う</text>
<text x="32" y="106" font-size="16" fill="#52667e" font-weight="400" text-anchor="start">Cornix の物理配列。全4段で最外列は無効・内側5列を使用。左右ノブは標準の音量・スクロール操作。</text>
