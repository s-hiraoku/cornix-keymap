<rect x="32" y="144" width="5" height="32" rx="2" fill="#246bc4" stroke="none"/>
<text x="49" y="168" font-size="25" fill="#18304b" font-weight="700" text-anchor="start">00  DEFAULT</text>
<text x="36" y="197" font-size="15" fill="#52667e" font-weight="400" text-anchor="start">通常入力  ·  青い下段は長押しの動作  ·  Alt = Option / Cmd = Command</text>
